[package]
name = "covalos"
version = "0.8.9"
edition = "2024"
description = "Native Rust IDE with multi-agent orchestration"
publish = false

[workspace]
members = [".", "crates/covalos-agents", "crates/covalos-engine"]

[dependencies]
covalos-agents = { path = "crates/covalos-agents" }
covalos-engine = { path = "crates/covalos-engine" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["syntect"] }
ignore = "0.4"
image = { version = "0.25", default-features = false }
regex = "1"
png = "0.18"
raw-window-handle = "0.6"
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing", "local-offset"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_Media", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
wry = { version = "=0.53.5", default-features = false }

[target.'cfg(all(windows, target_env = "gnu"))'.build-dependencies]
webview2-com-sys = "=0.38.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"

# `cargo deb --no-build` after `tools/third-party-notices.sh x86_64-unknown-linux-gnu build/notices`
# (the release workflow runs both).
[package.metadata.deb]
name = "covalos"
maintainer = "Matias Sánchez"
copyright = "Matias Sánchez"
section = "editors"
priority = "optional"
depends = "$auto"
extended-description = "Native desktop code editor written in Rust, with a built-in team of coding agents (Codex, Claude Code, Gemini) that run on your own CLIs and accounts."
assets = [
    ["target/release/covalos", "usr/bin/", "755"],
    ["packaging/linux/covalos.desktop", "usr/share/applications/", "644"],
    ["assets/brand/covalos-app-256.png", "usr/share/icons/hicolor/256x256/apps/covalos.png", "644"],
    ["build/notices/THIRD_PARTY_NOTICES.txt", "usr/share/doc/covalos/", "644"],
    ["build/notices/licenses/*", "usr/share/doc/covalos/licenses/", "644"],
]
