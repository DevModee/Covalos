[package]
name = "covalos"
version = "0.4.0"
edition = "2024"
description = "COVALOS — Native Rust IDE with multi-agent orchestration"
publish = false

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["syntect"] }
ignore = "0.4"
regex = "1"
png = "0.18"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
