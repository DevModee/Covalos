name: Release

# Builds the installers for every platform and publishes them to the GitHub release
# for the tag. Asset names are stable across versions, so links of the form
# releases/latest/download/<name> keep working (the website uses them).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.8.8
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: Compare the tag with Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The installer ships WebView2Loader.dll from the GNU build (see build.rs).
      - name: Install the GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/installer"
      - name: Install Inno Setup
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build the installer
        run: .\tools\build-windows-installer.ps1
      - name: Stage release assets
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $name = 'Covalos-Windows-x64-Setup.exe'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\Covalos-$version-Windows-x64-Setup.exe" "release\$name"
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "release\$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: meta
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Third-party notices
        run: bash tools/third-party-notices.sh ${{ matrix.target }} build/notices
      - name: Bundle Covalos.app
        run: |
          app=build/Covalos.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/covalos" "$app/Contents/MacOS/covalos"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp -R build/notices/. "$app/Contents/Resources/"
          iconset=build/covalos.iconset
          src=assets/brand/covalos-app-256.png
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" "$src" --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png" > /dev/null
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png" > /dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png" > /dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/covalos.icns"
          # Ad-hoc signature only. The app is not notarized yet.
          codesign --force --deep --sign - "$app"
      - name: Create the disk image
        run: |
          name="Covalos-macOS-${{ matrix.arch }}.dmg"
          mkdir -p build/dmg release
          cp -R build/Covalos.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Covalos -srcfolder build/dmg -ov -format UDZO "release/$name"
          (cd release && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: meta
    # The oldest supported Ubuntu LTS image, so the binary links against an older glibc
    # and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Third-party notices
        run: bash tools/third-party-notices.sh x86_64-unknown-linux-gnu build/notices
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Debian package
        run: |
          mkdir -p release
          cargo deb --no-build --locked --output release/Covalos-Linux-amd64.deb
      - name: AppImage
        run: |
          appdir=build/Covalos.AppDir
          install -Dm755 target/release/covalos "$appdir/usr/bin/covalos"
          install -Dm644 packaging/linux/covalos.desktop "$appdir/usr/share/applications/covalos.desktop"
          install -Dm644 assets/brand/covalos-app-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/covalos.png"
          mkdir -p "$appdir/usr/share/doc"
          cp -R build/notices "$appdir/usr/share/doc/covalos"
          cp packaging/linux/covalos.desktop "$appdir/covalos.desktop"
          cp assets/brand/covalos-app-256.png "$appdir/covalos.png"
          printf '%s\n' '#!/bin/sh' 'here="$(dirname "$(readlink -f "$0")")"' 'exec "$here/usr/bin/covalos" "$@"' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o build/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
          ARCH=x86_64 build/appimagetool --appimage-extract-and-run "$appdir" release/Covalos-Linux-x86_64.AppImage
      - name: Checksums
        run: |
          cd release
          for file in Covalos-Linux-amd64.deb Covalos-Linux-x86_64.AppImage; do
            sha256sum "$file" > "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [meta, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Release notes
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $VERSION." > notes.md
          fi
          cat packaging/release-notes-footer.md >> notes.md
      - name: Create or update the release
        run: |
          ls -l release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Covalos Beta $VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" release/* --verify-tag --title "Covalos Beta $VERSION" --notes-file notes.md --latest
          fi
